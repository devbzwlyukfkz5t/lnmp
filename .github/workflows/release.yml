name: Create Release with Zip

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 */7 * *

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Zip Archive
        # Zips the 'dist/' folder (or replace with '.' for the whole repo) while excluding git files
        run: zip -r release-package.zip . -x "*.git*" "*.github*"

      - name: Create GitHub Release & Upload Zip
        uses: softprops/action-gh-release@v2
        with:
          files: release-package.zip
          generate_release_notes: true
