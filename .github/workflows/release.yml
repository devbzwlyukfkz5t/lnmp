name: Create Release with Zip

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 */7 * *

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Zip Archive
        run: zip -r lnmp.zip . -x "*.git*" "*.github*"

      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")"
          touch release.txt
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 2026-11-16
          body_path: release.txt
          files: lnmp.zip
